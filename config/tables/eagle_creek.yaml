# Eagle Creek ML table: one row per 10 m cell of the aligned stack (2018-2021 epoch).
#   pci-zones table --config config/tables/eagle_creek.yaml
#
# Terrain here comes from the 2 m pipeline, averaged to 10 m; Montecito's comes from Landlab
# on a 10 m DEM. The definitions say so, and the ML side refuses to mix them unless told.
site: eagle_creek
description: Eagle Creek Fire 2017, 10 m; target from 2018-2021 repeat lidar.
data_dir: /mnt/c/Users/amehedi/Downloads/eagle_creek/aligned
extent: elevation_aligned.tif
output: /mnt/c/Users/amehedi/Downloads/ml_tables/eagle_creek.parquet

# Terrain from this repo's one method on the table's own 10 m DEM: terrain_slope,
# terrain_drainage_area, terrain_G, terrain_curvature, terrain_aspect. Same units and
# definitions at every site, so these are the terrain features to use across fires.
terrain:
  dem: elevation_aligned.tif

features:
  G:              {path: G_aligned.tif, units: m,
                   definition: "G = a S^(7/6), pci-source-zones D-infinity terrain on the 2 m DEM, mean per 10 m cell",
                   source: source_zone_pipeline_mosaic/G_pre.tif}
  slope:          {path: slope_aligned.tif, units: m/m, valid_range: [0, 20],
                   definition: "slope, pci-source-zones terrain on the 2 m DEM, mean per 10 m cell", source: S_pre.tif}
  drainage_area:  {path: drainage_area_aligned.tif, units: m2, scale: 2.0,
                   definition: "upslope contributing area of 2 m cells = D-infinity specific contributing area x 2 m, mean per 10 m cell",
                   source: a_pre.tif (m) x 2 m}
  curvature:      {path: curvature_aligned.tif, units: 1/m,
                   definition: "pci-source-zones curvature on the 2 m DEM, mean per 10 m cell", source: curvature_pre.tif}
  aspect:         {path: aspect_aligned.tif, units: degrees, valid_range: [0, 360],
                   definition: "gdaldem aspect on the 2018 DEM at 10 m", source: prep/aspect_pre_10m.tif}
  elevation:      {path: elevation_aligned.tif, units: m, definition: "ground elevation", source: "2018 lidar DEM, 2 m, mean per 10 m cell"}
  dnbr:           {path: nbr_diff_aligned.tif, units: dNBR x 1000, scale: -1.0,
                   definition: "differenced normalized burn ratio x 1000",
                   source: "HLS NBR post minus pre x 1000, sign flipped; BAER dNBR covers only 77 % of the site (mid-fire image)"}
  ndvi_diff:      {path: ndvi_diff_aligned.tif, units: "-", valid_range: [-2, 2], definition: "NDVI post-fire minus pre-fire"}
  soil_thickness: {path: soil_thickness_aligned.tif, units: m, valid_range: [0, 5],
                   definition: "depth to bedrock or lithic contact", source: landlab_data_prep soil__thickness (POLARIS/gNATSGO)}
  sand_total:     {path: sand_total_aligned.tif, units: "%", valid_range: [0, 100], definition: "sand fraction, topsoil", source: landlab_data_prep}
  silt_total:     {path: silt_total_aligned.tif, units: "%", valid_range: [0, 100], definition: "silt fraction, topsoil", source: landlab_data_prep}
  ksat:           {path: ksat_aligned.tif, units: m/day, valid_range: [0, 100],
                   definition: "saturated hydraulic conductivity, landlab_data_prep pedotransfer from pH, clay, silt and CEC"}
  ph:             {path: ph_aligned.tif, units: pH, valid_range: [3, 10], definition: "soil pH, 1:1 water, topsoil", source: landlab_data_prep}

labels:
  p_obs_union:
    raster: p_obs_union_aligned.tif
    kind: continuous
    valid_range: [0, 1]
    definition: "share of 2 m cells with C2 or C3 evidence per 10 m cell, 2018-2021 lidar dDEM (pci-source-zones p_obs stage, mosaic)"
    description: "observed erosion probability"
  initiation:
    polygons: /mnt/c/Users/amehedi/Downloads/eaglecreek_inventory.gpkg
    layer: inventory
    where:
      epoch: "2018_2021"
      Primary: ["07_DF Pre-Initiation erosion in channel", "08_DF Pre-Initiation rills on slope",
                "09_DF Initiation - In channel initiation (erosion)", "10_DF Initiation - Road fill embankment (erosion)",
                "12_DF Initiation - Deep landslide (evacuated)", "14_DF Initiation - Shallow landslide (evacuated)"]
    kind: binary
    all_touched: true        # small scars cover no cell centre; keep every mapped initiation
    outside: background
    domain: {polygons: /mnt/c/Users/amehedi/Downloads/eaglecreek_inventory.gpkg, layer: mapping_area, where: {epoch: "2018_2021"}}
    negatives: {min_distance_m: 50}   # closer to a positive: unknown, not a doubtful 0
    definition: "debris-flow initiation polygons mapped for 2018-2021 (inventory codes 07, 08, 09, 10, 12, 14), every cell a polygon touches; in the mapping area, 0 at least 50 m from a positive cell, unknown closer"
  process:
    polygons: /mnt/c/Users/amehedi/Downloads/eaglecreek_inventory.gpkg
    layer: inventory
    where: {epoch: "2018_2021"}
    kind: class
    class_field: Primary
    outside: background
    domain: {polygons: /mnt/c/Users/amehedi/Downloads/eaglecreek_inventory.gpkg, layer: mapping_area, where: {epoch: "2018_2021"}}
    negatives: {min_distance_m: 50}   # closer to a positive: unknown, not a doubtful 0
    definition: "process polygons mapped for 2018-2021 (eaglecreek_inventory.gpkg), grouped: 1 debris-flow initiation, 2 transport, 3 deposition, 4 other landslide or fall; partly covered cells unknown; in the mapping area, 0 at least 50 m from a positive cell, unknown closer"
    description: "the grouping is a proposal; edit the classes mapping to change it"
    classes:
      "01_Deep landslide (evacuated)": 4
      "02_Deep landslide (deposition)": 4
      "03_Shallow landslide (evacuated)": 4
      "04_Shallow landslide (deposition)": 4
      "05_Fall/Topple (evacuated)": 4
      "06_Fall/Topple (deposition)": 4
      "07_DF Pre-Initiation erosion in channel": 1
      "08_DF Pre-Initiation rills on slope": 1
      "09_DF Initiation - In channel initiation (erosion)": 1
      "10_DF Initiation - Road fill embankment (erosion)": 1
      "12_DF Initiation - Deep landslide (evacuated)": 1
      "13_DF Initiation - Deep landslide (deposition)": 3
      "14_DF Initiation - Shallow landslide (evacuated)": 1
      "15_DF Initiation - Shallow landslide (deposition)": 3
      "16_DF Transport - Predominantly Erosion": 2
      "17_DF Transport – Predominantly Deposition": 2
      "18_DF Transport – Predominantly Transport (mixed erosion and deposition)": 2
      "20_DF Transport - Channel bank/inner gorge erosion": 2
      "21_DF Deposition – Predominantly Deposition": 3
      "21_DF Deposition – Predominantly Deposition ": 3
      "22_DF Deposition – Levee (deposition)": 3
      "23_DF Deposition – Hyper concentrated flow deposition": 3
      "24_DF Deposition – Woody-debris (jam)": 3

# The first train/test sample: whole 500 m blocks, 30 % of the initiation positives and of
# the negatives in test. blocks_2 to blocks_5 draw other test blocks.
splits:
  blocks:   {blocks: {size_m: 500, test_fraction: 0.3, seed: 42, stratify: initiation}}
  # the same rule with other seeds, so a run can be repeated and scored as a mean and a range
  blocks_2: {blocks: {size_m: 500, test_fraction: 0.3, seed: 2, stratify: initiation}}
  blocks_3: {blocks: {size_m: 500, test_fraction: 0.3, seed: 6, stratify: initiation}}   # seed 3 fails the share check at Pioneer
  blocks_4: {blocks: {size_m: 500, test_fraction: 0.3, seed: 4, stratify: initiation}}
  blocks_5: {blocks: {size_m: 500, test_fraction: 0.3, seed: 5, stratify: initiation}}
