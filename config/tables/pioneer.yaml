# Pioneer Fire ML table: one row per 10 m cell of the whole burned watershed (full area).
#   pci-zones table --config config/tables/pioneer.yaml
#
# No observed erosion probability yet (the evidence run on the new change map is pending), so
# the labels are the 89 USGS-mapped initiation points: yes/no, and by type. They exist only in
# the lidar footprint; outside it every cell is unknown. Inside it, an unmapped cell is a
# negative only when it is at least 50 m from every point's cells. The dDEM is not used to
# pick negatives: at 10 m it shows change at 14 % of the point cells and 14 % of the rest.
#
# The `blocks` split is the first train/test sample: whole 500 m blocks, 30 % of the
# positives and of the negatives in test. blocks_2 to blocks_5 draw other test blocks.
site: pioneer
description: Pioneer Fire 2024, Lake Chelan, 10 m; storm of 8-12 December 2025; points from USGS (doi:10.5066/P1GNNSZU).
data_dir: /mnt/c/Users/amehedi/Downloads/pioneer_hf/full_area/inputs
extent: topographic__elevation.tif
output: /mnt/c/Users/amehedi/Downloads/ml_tables/pioneer.parquet

terrain:
  dem: topographic__elevation.tif

features:
  elevation:      {path: topographic__elevation.tif, units: m, definition: "ground elevation", source: USGS 3DEP 1/3 arc-second}
  dnbr:           {path: /mnt/c/Users/amehedi/Downloads/pioneer/huc_pioneer1_10m/remote_sensing/hls_delta_nbr.tif,
                   units: dNBR x 1000, scale: -1.0, definition: "differenced normalized burn ratio x 1000",
                   source: "HLS v2.0 medians, Jul-Sep 2023 vs Jul-Sep 2025; stored as post minus pre, sign flipped"}
  ndvi_diff:      {path: vegetation__delta_ndvi.tif, units: "-", valid_range: [-2, 2], definition: "NDVI post-fire minus pre-fire",
                   source: "HLS v2.0 medians, Jul-Sep 2023 vs Jul-Sep 2025"}
  soil_thickness: {path: soil__thickness.tif, units: m, valid_range: [0, 5], definition: "depth to bedrock or lithic contact",
                   source: SOLUS100 anylithicdpt via landlab_data_prep}
  sand_total:     {path: sand__total.tif, units: "%", valid_range: [0, 100], definition: "sand fraction, topsoil", source: SOLUS100}
  silt_total:     {path: silt__total.tif, units: "%", valid_range: [0, 100], definition: "silt fraction, topsoil", source: SOLUS100}
  ksat:           {path: soil__saturated_hydraulic_conductivity.tif, units: m/day, valid_range: [0, 100],
                   definition: "saturated hydraulic conductivity, landlab_data_prep pedotransfer from pH, clay, silt and CEC"}
  ph:             {path: pH.tif, units: pH, valid_range: [3, 10], definition: "soil pH, 1:1 water, topsoil", source: SOLUS100}

labels:
  initiation:
    points: /mnt/c/Users/amehedi/Downloads/pioneer_hf/truth/initiation_points.gpkg
    kind: binary
    buffer_cells: 1
    outside: background
    domain: {polygons: /mnt/c/Users/amehedi/Downloads/pioneer_hf/footprint/aoi.gpkg}
    negatives: {min_distance_m: 50}   # closer to a positive: unknown, not a doubtful 0
    definition: "USGS-mapped debris-flow initiation points (Rengers and others 2026, doi:10.5066/P1GNNSZU), 3 x 3 cells around each; in the lidar footprint, 0 at least 50 m from a positive cell, unknown closer"
  initiation_type:
    points: /mnt/c/Users/amehedi/Downloads/pioneer_hf/truth/initiation_points.gpkg
    kind: class
    class_field: FailureTyp
    classes: {LS: 1, Runoff: 2, Firehose: 3}
    buffer_cells: 1
    outside: background
    on_overlap: unknown
    domain: {polygons: /mnt/c/Users/amehedi/Downloads/pioneer_hf/footprint/aoi.gpkg}
    negatives: {min_distance_m: 50}   # closer to a positive: unknown, not a doubtful 0
    definition: "USGS-mapped debris-flow initiation points by type (1 landslide, 2 runoff, 3 firehose), 3 x 3 cells around each; in the lidar footprint, 0 at least 50 m from a positive cell, unknown closer"

splits:
  blocks:   {blocks: {size_m: 500, test_fraction: 0.3, seed: 42, stratify: initiation}}
  # the same rule with other seeds, so a run can be repeated and scored as a mean and a range
  blocks_2: {blocks: {size_m: 500, test_fraction: 0.3, seed: 2, stratify: initiation}}
  blocks_3: {blocks: {size_m: 500, test_fraction: 0.3, seed: 6, stratify: initiation}}   # seed 3 fails the share check at Pioneer
  blocks_4: {blocks: {size_m: 500, test_fraction: 0.3, seed: 4, stratify: initiation}}
  blocks_5: {blocks: {size_m: 500, test_fraction: 0.3, seed: 5, stratify: initiation}}
