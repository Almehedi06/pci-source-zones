site: montecito
paths:
  output_dir: /home/abdullah/ml_output
  data_dir: /mnt/c/Users/amehedi/Downloads/thomas/aligned
ml:
  output_subdir: source_area_workflow/ml/random_forest_regressor_p_obs_union
  base_rasters:
    slope: slope_aligned.tif
    specific_area: drainage_area_aligned.tif
  target:
    type: raster_continuous
    path: p_obs_union_aligned.tif
    export: true
  feature_paths:
    G: /mnt/c/Users/amehedi/Downloads/G_topographic_driving_index.tif
    curvature: curvature_aligned.tif
    aspect: aspect_aligned.tif
    elevation: elevation_aligned.tif
    burn_severity: burn_severity_aligned.tif
    et_diff: et_diff_aligned.tif
    ndvi_diff: ndvi_diff_aligned.tif
    soil_thickness: soil_thickness_aligned.tif
    sand_total: sand_total_aligned.tif
    silt_total: silt_total_aligned.tif
    clay_total: clay_total_aligned.tif
    porosity: porosity_aligned.tif
    ksat: ksat_aligned.tif
    ph: ph_aligned.tif
    field_capacity: field_capacity_aligned.tif
    landcover: landcover_aligned.tif
    frac_sig_erosion: /mnt/c/Users/amehedi/Downloads/dDEM_10m_evidence_from_1m/frac_sig_erosion_10m.tif
    frac_sig_deposition: /mnt/c/Users/amehedi/Downloads/dDEM_10m_evidence_from_1m/frac_sig_deposition_10m.tif
    std_DoD: /mnt/c/Users/amehedi/Downloads/dDEM_10m_evidence_from_1m/std_DoD_10m.tif
    frac_dG_positive: /mnt/c/Users/amehedi/Downloads/DeltaG_10m_from_1m/frac_DeltaG_positive_10m_from_1m.tif
    precip_jan9: precip_jan9_aligned.tif
    precip_jan10: precip_jan10_aligned.tif
  features:
    numeric:
    - G
    - slope
    - drainage_area
    - curvature
    - aspect
    - elevation
    - et_diff
    - ndvi_diff
    - soil_thickness
    - sand_total
    - silt_total
    - ksat
    - ph
    - precip_jan9
    categorical: []
  split:
    method: polygons
    polygons:
      path: /mnt/c/Users/amehedi/Downloads/train_test_poly1.gpkg
      id_field: id
      train_ids:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      test_ids:
      - 7
      - 8
    val_size: 0.1
  model:
    type: random_forest_regressor
    n_estimators: 150
    max_depth: 15
    min_samples_leaf: 20
    max_features: 0.2
    max_samples: 0.8
    bootstrap: true
    criterion: squared_error
    random_state: 42
    n_jobs: -1
  prediction:
    probability_threshold: 0.5
    exclude_channels: true
