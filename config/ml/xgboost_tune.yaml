site: montecito

paths:
  output_dir: /home/abdullah/ml_output
  data_dir: /mnt/c/Users/amehedi/Downloads/thomas/aligned

ml:
  output_subdir: source_area_workflow/ml/{model}

  base_rasters:
    slope:         slope_aligned.tif
    specific_area: drainage_area_aligned.tif

  target:
    type: raster_continuous
    path: C_eff_log1p_aligned.tif
    export: true

  feature_paths:
    G:             /mnt/c/Users/amehedi/Downloads/G_topographic_driving_index.tif
    curvature:     curvature_aligned.tif
    aspect:        aspect_aligned.tif
    elevation:     elevation_aligned.tif
    burn_severity: burn_severity_aligned.tif
    dnbr:          dnbr_aligned.tif
    et_diff:       et_diff_aligned.tif
    ndvi_diff:     ndvi_diff_aligned.tif
    soil_thickness: soil_thickness_aligned.tif
    sand_total:    sand_total_aligned.tif
    silt_total:    silt_total_aligned.tif
    clay_total:    clay_total_aligned.tif
    porosity:      porosity_aligned.tif
    ksat:          ksat_aligned.tif
    ph:            ph_aligned.tif
    field_capacity: field_capacity_aligned.tif
    precip_jan9:   precip_jan9_aligned.tif
    precip_jan10:  precip_jan10_aligned.tif

  features:
    numeric:
      - G
      - slope
      - drainage_area
      - curvature
      - aspect
      - elevation
      # - burn_severity      # zero importance
      - et_diff
      - ndvi_diff
      - soil_thickness
      - sand_total
      - silt_total
      # - clay_total         # near-zero, collinear with sand+silt
      # - porosity           # zero importance, only 4 discrete values
      - ksat
      - ph
      # - field_capacity     # zero importance, only 4 discrete values
      - precip_jan9
      # - precip_jan10       # r=1.00 with precip_jan9, redundant
    categorical: []

  split:
    method: polygons
    polygons:
      path:      /mnt/c/Users/amehedi/Downloads/train_test_poly1.gpkg  # absolute — outside data_dir
      id_field:  id
      train_ids: [1, 2, 3, 4, 5, 6]
      test_ids:  [7, 8]
    val_size: 0.1

  model:
    type: xgboost_regressor
    random_state: 42
    n_jobs: 1

  tuning:
    search_method: random_search
    scoring: r2
    n_iter: 50
    random_state: 42
    n_jobs: 32
    include_validation_in_tuning: false
    dataset_cache: true

    cv:
      method: polygon_groups       # leave-one-polygon-out
      n_splits: 6
      seed: 42

    search_space:
      n_estimators:     [20, 30, 50, 80, 100, 150, 200]
      max_depth:        [3, 4, 6, 8, 10]
      learning_rate:    [0.001, 0.01, 0.02, 0.05, 0.08, 0.1, 0.2]
      subsample:        [0.6, 0.7, 0.8, 1.0]
      colsample_bytree: [0.5, 0.6, 0.8, 1.0]
      min_child_weight: [5, 10, 20, 50]
      reg_alpha:        [0.0, 0.1, 0.5, 1.0]
      reg_lambda:       [0.5, 1.0, 2.0, 5.0]

  prediction:
    exclude_channels: false
