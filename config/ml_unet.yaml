    specific_area: /mnt/c/Users/amehedi/Downloads/thomas/aligned/drainage_area_aligned.tif
    g: /mnt/c/Users/amehedi/Downloads/G_topographic_driving_index.tif
    dem_diff: /mnt/c/Users/amehedi/Downloads/thomas/dem_diff.tif

  target:
    type: raster_continuous
    path: /mnt/c/Users/amehedi/Downloads/thomas/aligned/target_src_hi_aligned.tif
    export: true
    # --- classification target (re-enable to switch back) ---
    # type: physics_dod
    # c_min: 5
    # c_channel: 120
    # erosion_threshold_m: -0.55
    # exclude_channels_from_training: true
    # nodata: 255

  feature_paths:
    burn_severity: /mnt/c/Users/amehedi/Downloads/thomas/burn_severity_montecito_aoi_aligned.tif
    soil_texture: /mnt/c/Users/amehedi/Downloads/thomas/soil__texture.tif
    soil_thickness: /mnt/c/Users/amehedi/Downloads/thomas/soil__thickness.tif
    soil_density: /mnt/c/Users/amehedi/Downloads/thomas/soil__density.tif
    sand_total: /mnt/c/Users/amehedi/Downloads/thomas/sand__total.tif
    silt_total: /mnt/c/Users/amehedi/Downloads/thomas/silt__total.tif
    clay_total: /mnt/c/Users/amehedi/Downloads/thomas/clay__total.tif
    porosity: /mnt/c/Users/amehedi/Downloads/thomas/porosity.tif
    pH: /mnt/c/Users/amehedi/Downloads/thomas/pH.tif
    field_capacity: /mnt/c/Users/amehedi/Downloads/thomas/field__capacity.tif
    saturated_water_content: /mnt/c/Users/amehedi/Downloads/thomas/saturated__water_content.tif
    soil_transmissivity: /mnt/c/Users/amehedi/Downloads/thomas/soil__transmissivity.tif
    saturated_hydraulic_conductivity: /mnt/c/Users/amehedi/Downloads/thomas/soil__saturated_hydraulic_conductivity.tif
    landcover: /mnt/c/Users/amehedi/Downloads/thomas/landcover.tif
    et_diff: /mnt/c/Users/amehedi/Downloads/thomas/gee_lai_ndvi_et/ET_median_pre_2017-04-01_to_2017-08-30_post_2018-04-01_to_2018-08-30_diff_post_minus_pre_aligned.tif
    ndvi_diff: /mnt/c/Users/amehedi/Downloads/thomas/gee_lai_ndvi_et/NDVI_median_pre_2017-04-01_to_2017-08-30_post_2018-04-01_to_2018-08-30_diff_post_minus_pre_aligned.tif
    curvature: /mnt/c/Users/amehedi/Downloads/thomas/aligned/curvature_aligned.tif
    # --- dDEM sub-grid evidence (1m → 10m aggregates) ---
    frac_sig_erosion: /mnt/c/Users/amehedi/Downloads/dDEM_10m_evidence_from_1m/frac_sig_erosion_10m.tif
    frac_sig_deposition: /mnt/c/Users/amehedi/Downloads/dDEM_10m_evidence_from_1m/frac_sig_deposition_10m.tif
    std_DoD: /mnt/c/Users/amehedi/Downloads/dDEM_10m_evidence_from_1m/std_DoD_10m.tif
    median_DoD: /mnt/c/Users/amehedi/Downloads/dDEM_10m_evidence_from_1m/median_DoD_10m.tif
    # --- dG sub-grid evidence (1m → 10m aggregates) ---
    frac_dG_positive: /mnt/c/Users/amehedi/Downloads/DeltaG_10m_from_1m/frac_DeltaG_positive_10m_from_1m.tif
    median_dG: /mnt/c/Users/amehedi/Downloads/DeltaG_10m_from_1m/median_DeltaG_10m_from_1m.tif
    std_dG: /mnt/c/Users/amehedi/Downloads/DeltaG_10m_from_1m/std_DeltaG_10m_from_1m.tif

  features:
    numeric:
      - slope
      - drainage_area
      - curvature
      # - et_diff
      # - ndvi_diff
      # - soil_thickness
      # - soil_density
      # - sand_total
      # - silt_total
      # - clay_total
      # - porosity
      # - field_capacity
      # - saturated_water_content
      # - soil_transmissivity
      # - saturated_hydraulic_conductivity
      # - frac_sig_erosion
      # - frac_sig_deposition
      # - std_DoD
      # - frac_dG_positive
    categorical: []
      # - burn_severity
      # - soil_texture
      # - landcover

  split:
    method: random
    seed: 42
    test_size: 0.2
    val_size: 0.0
    # negative_to_positive_ratio: 3   # classification only
    # --- spatial split (re-enable for production) ---
    # method: polygons
    # polygons:
    #   path: /mnt/c/Users/amehedi/Downloads/dunne_lithology_polygons_unlabeled.gpkg
    #   id_field: poly_id
    #   train_ids: [3]
    #   test_ids: [4]

  model:
    type: unet
    base_filters: 32       # doubles each encoder level: 32→64→128→256→512
    depth: 4               # number of encoder/decoder levels
    dropout: 0.2           # spatial dropout inside conv blocks

  unet:
    patch_size: 128        # pixels (H × W per patch)
    overlap: 0.5           # 50% overlap between patches (train stride = patch_size/2)
    batch_size: 16
    epochs: 50
    learning_rate: 0.001
    pos_weight: 3.0        # upweight positive (source) pixels in BCE loss
    early_stopping_patience: 10
    val_fraction: 0.15     # fraction of train patches held out for validation
    num_workers: 0         # DataLoader workers (0 = main process, safe on Windows/WSL2)
    device: auto           # auto | cpu | cuda

  prediction:
    probability_threshold: 0.5
    exclude_channels: true
