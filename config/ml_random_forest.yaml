site: montecito

paths:
  output_dir: /mnt/c/Users/amehedi/Downloads

ml:
  output_subdir: source_area_workflow/ml/{model}

  base_rasters:
    slope: /mnt/c/Users/amehedi/Downloads/thomas/aligned/slope_aligned.tif
    specific_area: /mnt/c/Users/amehedi/Downloads/thomas/aligned/drainage_area_aligned.tif
    # g and dem_diff not needed for raster_continuous target
    # g: /mnt/c/Users/amehedi/Downloads/thomas/G_from_topographic_elevation.tif
    # dem_diff: /mnt/c/Users/amehedi/Downloads/thomas/dem_diff.tif

  target:
    type: raster_continuous
    path: /mnt/c/Users/amehedi/Downloads/thomas/aligned/target_src_hi_aligned.tif
    export: true
    # --- classification target (re-enable to switch back) ---
    # type: physics_dod
    # c_min: 5
    # c_channel: 120
    # erosion_threshold_m: -0.55
    # exclude_channels_from_training: true
    # nodata: 255

  feature_paths:
    curvature:           /mnt/c/Users/amehedi/Downloads/thomas/aligned/curvature_aligned.tif
    aspect:              /mnt/c/Users/amehedi/Downloads/thomas/aligned/aspect_aligned.tif
    elevation:           /mnt/c/Users/amehedi/Downloads/thomas/aligned/elevation_aligned.tif
    burn_severity:       /mnt/c/Users/amehedi/Downloads/thomas/aligned/burn_severity_aligned.tif
    et_diff:             /mnt/c/Users/amehedi/Downloads/thomas/aligned/et_diff_aligned.tif
    ndvi_diff:           /mnt/c/Users/amehedi/Downloads/thomas/aligned/ndvi_diff_aligned.tif
    soil_thickness:      /mnt/c/Users/amehedi/Downloads/thomas/aligned/soil_thickness_aligned.tif
    sand_total:          /mnt/c/Users/amehedi/Downloads/thomas/aligned/sand_total_aligned.tif
    silt_total:          /mnt/c/Users/amehedi/Downloads/thomas/aligned/silt_total_aligned.tif
    clay_total:          /mnt/c/Users/amehedi/Downloads/thomas/aligned/clay_total_aligned.tif
    porosity:            /mnt/c/Users/amehedi/Downloads/thomas/aligned/porosity_aligned.tif
    ksat:                /mnt/c/Users/amehedi/Downloads/thomas/aligned/ksat_aligned.tif
    ph:                  /mnt/c/Users/amehedi/Downloads/thomas/aligned/ph_aligned.tif
    field_capacity:      /mnt/c/Users/amehedi/Downloads/thomas/aligned/field_capacity_aligned.tif
    landcover:           /mnt/c/Users/amehedi/Downloads/thomas/aligned/landcover_aligned.tif
    frac_sig_erosion:    /mnt/c/Users/amehedi/Downloads/dDEM_10m_evidence_from_1m/frac_sig_erosion_10m.tif
    frac_sig_deposition: /mnt/c/Users/amehedi/Downloads/dDEM_10m_evidence_from_1m/frac_sig_deposition_10m.tif
    std_DoD:             /mnt/c/Users/amehedi/Downloads/dDEM_10m_evidence_from_1m/std_DoD_10m.tif
    frac_dG_positive:    /mnt/c/Users/amehedi/Downloads/DeltaG_10m_from_1m/frac_DeltaG_positive_10m_from_1m.tif

  features:
    numeric:
      - slope
      - drainage_area
      - curvature
      - aspect
      - elevation
      - burn_severity
      - et_diff
      - ndvi_diff
      - soil_thickness
      - sand_total
      - silt_total
      - clay_total
      - porosity
      - ksat
      - ph
      - field_capacity
      # --- evidence features (comment out to avoid leakage) ---
      # - frac_sig_erosion
      # - frac_sig_deposition
      # - std_DoD
      # - frac_dG_positive
    categorical: []
      # - landcover

  split:
    method: random
    seed: 42
    test_size: 0.2
    val_size: 0.1
    # negative_to_positive_ratio: 3   # classification only
    # --- spatial split (re-enable for production) ---
    # method: polygons
    # polygons:
    #   path: /mnt/c/Users/amehedi/Downloads/dunne_lithology_polygons_unlabeled.gpkg
    #   id_field: poly_id
    #   train_ids: [3]
    #   test_ids: [4]

  model:
    type: random_forest_regressor
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: sqrt
    random_state: 42
    n_jobs: -1

  prediction:
    probability_threshold: 0.5
    exclude_channels: true
