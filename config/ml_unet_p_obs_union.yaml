site: montecito

# Attention UNet regression on p_obs_union — the strongest target found so far
# (full 541K-pixel spatial coverage, no truncation, unlike C_eff targets).
# Cloned from ml_unet_regression.yaml with target/tobit swapped after fixing
# the use_all_pixels/tobit train-region leakage bug in unet_workflow.py —
# this is the first honest (post-fix) run of this architecture on this target.

paths:
  output_dir: /home/abdullah/ml_output
  # Relative feature/target filenames resolve against this directory.
  # Override at runtime: python scripts/09_run_unet.py --data-dir /path/to/event/aligned
  data_dir: /mnt/c/Users/amehedi/Downloads/thomas/aligned

ml:
  # Distinct output dir from ml_unet_regression.yaml's C_eff/tobit run —
  # run_unet_workflow() always names the model "unet", so without this
  # override both configs would silently overwrite the same directory.
  output_subdir: source_area_workflow/ml/unet_p_obs_union

  base_rasters:
    slope:         slope_aligned.tif
    specific_area: drainage_area_aligned.tif

  target:
    type: raster_continuous
    path: p_obs_union_aligned.tif
    export: true

  feature_paths:
    # G is outside the aligned folder — keep as absolute until moved into data_dir for new events
    G:             /mnt/c/Users/amehedi/Downloads/G_topographic_driving_index.tif
    curvature:     curvature_aligned.tif
    aspect:        aspect_aligned.tif
    elevation:     elevation_aligned.tif
    burn_severity: burn_severity_aligned.tif
    et_diff:       et_diff_aligned.tif
    ndvi_diff:     ndvi_diff_aligned.tif
    soil_thickness: soil_thickness_aligned.tif
    sand_total:    sand_total_aligned.tif
    silt_total:    silt_total_aligned.tif
    clay_total:    clay_total_aligned.tif
    porosity:      porosity_aligned.tif
    ksat:          ksat_aligned.tif
    ph:            ph_aligned.tif
    field_capacity: field_capacity_aligned.tif
    precip_jan9:   precip_jan9_aligned.tif
    precip_jan10:  precip_jan10_aligned.tif

  features:
    numeric:
      - G
      - slope
      - drainage_area
      - curvature
      - aspect
      - elevation
      - et_diff
      - ndvi_diff
      - soil_thickness
      - sand_total
      - silt_total
      - ksat
      - ph
      - precip_jan9
    categorical: []

  split:
    method: polygons
    polygons:
      # Polygon file is outside the aligned folder — keep absolute or copy to data_dir for new events
      path:      /mnt/c/Users/amehedi/Downloads/train_test_poly1.gpkg
      id_field:  id
      train_ids: [1, 2, 3, 4, 5, 6]
      test_ids:  [7, 8]
    val_size: 0.1

  model:
    type: unet
    base_filters: 16
    depth: 3
    dropout: 0.2
    attention: true
    tobit: false

  unet:
    patch_size: 128
    overlap: 0.75
    batch_size: 16
    epochs: 1000
    learning_rate: 0.001
    early_stopping_patience: 50
    val_fraction: 0.15
    use_all_pixels: true
    num_workers: 0
    device: auto

  prediction:
    exclude_channels: false
